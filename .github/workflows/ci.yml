name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Wazuh XML configs and rule correlation
        run: python scripts/validate_soc_lab.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
